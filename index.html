<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevOps Portfolio</title>
  <style>
    :root {
      --bg1: #071a3d;
      --bg2: #0b3a8c;
      --accent: #3d9bff;
      --accent2: #6ff3ff;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      color: #fff;
      background: radial-gradient(ellipse at 50% 0%, var(--bg2) 0%, var(--bg1) 60%, #030b1f 100%);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1200px;
    }

    /* 3D perspective grid floor */
    .floor {
      position: fixed;
      left: -50%; right: -50%; bottom: -10%;
      height: 60%;
      background-image:
        linear-gradient(var(--accent2) 1px, transparent 1px),
        linear-gradient(90deg, var(--accent2) 1px, transparent 1px);
      background-size: 60px 60px;
      transform: rotateX(70deg);
      transform-origin: top center;
      opacity: 0.35;
      animation: slide 3s linear infinite;
      mask-image: linear-gradient(to bottom, transparent, #000 40%);
      -webkit-mask-image: linear-gradient(to bottom, transparent, #000 40%);
    }
    @keyframes slide { to { background-position: 0 60px; } }

    /* floating 3D cubes */
    .cube-wrap { position: fixed; width: 60px; height: 60px; transform-style: preserve-3d; }
    .cube { position: absolute; inset: 0; transform-style: preserve-3d; animation: spin 10s linear infinite; }
    .cube div {
      position: absolute; width: 60px; height: 60px;
      border: 2px solid var(--accent);
      background: rgba(61, 155, 255, 0.14);
      box-shadow: 0 0 14px rgba(61, 155, 255, 0.55);
    }
    .cube .f { transform: translateZ(30px); }
    .cube .b { transform: rotateY(180deg) translateZ(30px); }
    .cube .r { transform: rotateY(90deg) translateZ(30px); }
    .cube .l { transform: rotateY(-90deg) translateZ(30px); }
    .cube .t { transform: rotateX(90deg) translateZ(30px); }
    .cube .m { transform: rotateX(-90deg) translateZ(30px); }
    @keyframes spin { to { transform: rotateX(360deg) rotateY(360deg); } }
    .c1 { top: 12%; left: 10%; }
    .c2 { top: 65%; left: 18%; transform: scale(0.7); }
    .c2 .cube { animation-duration: 14s; }
    .c3 { top: 18%; right: 12%; transform: scale(1.2); }
    .c3 .cube { animation-duration: 8s; }
    .c3 .cube div { border-color: var(--accent2); background: rgba(111,243,255,0.10); box-shadow: 0 0 14px rgba(111,243,255,0.5); }
    .c4 { top: 70%; right: 15%; transform: scale(0.8); }

    /* 3D tilt card */
    .card-wrap { transform-style: preserve-3d; transition: transform 0.1s ease-out; }
    .card {
      position: relative;
      width: min(92vw, 560px);
      padding: 44px 36px;
      text-align: center;
      border-radius: 20px;
      background: linear-gradient(145deg, rgba(255,255,255,0.14), rgba(255,255,255,0.04));
      border: 1px solid rgba(255,255,255,0.25);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow:
        0 30px 60px rgba(0,0,0,0.55),
        0 0 50px rgba(61,155,255,0.40),
        inset 0 0 30px rgba(255,255,255,0.06);
      transform-style: preserve-3d;
    }
    .card h1 {
      margin: 0 0 12px;
      font-size: clamp(30px, 6vw, 46px);
      letter-spacing: 1px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text; background-clip: text;
      color: transparent;
      transform: translateZ(60px);
      text-shadow: 0 6px 20px rgba(61,155,255,0.40);
    }
    .card p { margin: 0 0 22px; color: #dcebff; transform: translateZ(35px); }
    .tags { transform: translateZ(50px); }
    .tag {
      display: inline-block; margin: 5px; padding: 7px 14px;
      border-radius: 8px; font-size: 14px; font-weight: 600;
      background: linear-gradient(135deg, #1d6fe0, #2fa8ff);
      box-shadow: 0 6px 0 #0d3f94, 0 10px 18px rgba(0,0,0,0.4);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .tag:hover { transform: translateY(4px); box-shadow: 0 2px 0 #0d3f94, 0 5px 10px rgba(0,0,0,0.4); }

    @media (prefers-reduced-motion: reduce) {
      .floor, .cube { animation: none; }
    }
  </style>
</head>
<body>
  <div class="floor"></div>

  <div class="cube-wrap c1"><div class="cube"><div class="f"></div><div class="b"></div><div class="r"></div><div class="l"></div><div class="t"></div><div class="m"></div></div></div>
  <div class="cube-wrap c2"><div class="cube"><div class="f"></div><div class="b"></div><div class="r"></div><div class="l"></div><div class="t"></div><div class="m"></div></div></div>
  <div class="cube-wrap c3"><div class="cube"><div class="f"></div><div class="b"></div><div class="r"></div><div class="l"></div><div class="t"></div><div class="m"></div></div></div>
  <div class="cube-wrap c4"><div class="cube"><div class="f"></div><div class="b"></div><div class="r"></div><div class="l"></div><div class="t"></div><div class="m"></div></div></div>

  <div class="card-wrap" id="wrap">
    <div class="card">
      <h1>DevOps Portfolio by Rushi</h1>
      <p>Built, tested, and deployed automatically using Jenkins CI/CD</p>
      <div class="tags">
        <span class="tag">GitHub</span>
        <span class="tag">Jenkins</span>
        <span class="tag">SonarQube</span>
        <span class="tag">Docker</span>
        <span class="tag">Amazon ECR</span>
      </div>
    </div>
  </div>

  <script>
    var wrap = document.getElementById('wrap');
    document.addEventListener('mousemove', function (e) {
      var x = (e.clientX / window.innerWidth - 0.5) * 2;
      var y = (e.clientY / window.innerHeight - 0.5) * 2;
      wrap.style.transform = 'rotateY(' + (x * 14) + 'deg) rotateX(' + (-y * 14) + 'deg)';
    });
    document.addEventListener('mouseleave', function () {
      wrap.style.transform = 'rotateY(0deg) rotateX(0deg)';
    });
  </script>
</body>
</html>
