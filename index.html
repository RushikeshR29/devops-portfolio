<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevOps Portfolio</title>
  <style>
    body { font-family: Arial, sans-serif; background: #0f172a; color: #e2e8f0;
           display: flex; align-items: center; justify-content: center;
           min-height: 100vh; margin: 0; }
    .card { max-width: 560px; padding: 32px; background: #1e293b;
            border-radius: 12px; text-align: center; }
    h1 { margin-top: 0; }
    .tag { display: inline-block; margin: 4px; padding: 4px 10px;
           background: #334155; border-radius: 6px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>DevOps Portfolio</h1>
    <p>Built and delivered automatically by a CI/CD pipeline.</p>
    <p>
      <span class="tag">GitHub</span><span class="tag">Jenkins</span>
      <span class="tag">SonarQube</span><span class="tag">Docker</span>
      <span class="tag">Amazon ECR</span>
    </p>
  </div>
</body>
</html>
